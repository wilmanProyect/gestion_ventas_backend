services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: gestion_ventas_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-gestion_ventas_db}
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gestion_ventas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gestion_ventas_network

  # Almacenamiento MinIO
  minio:
    image: minio/minio:latest
    container_name: gestion_ventas_minio
    restart: always
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - gestion_ventas_network

volumes:
  postgres_data:
  minio_data:

networks:
  gestion_ventas_network:
    driver: bridge
